<!DOCTYPE html>
<html lang="en-SG">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Offline — PayNow QR Generator</title>
    <meta name="theme-color" content="#7b2d8e">
    <meta name="robots" content="noindex">
    <link rel="icon" href="./img/favicon.svg" type="image/svg+xml">
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      body{
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
        background:#f0f2f5;color:#1a1a2e;min-height:100vh;
        display:flex;align-items:center;justify-content:center;
        padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right))
                max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
        text-align:center;
      }
      .card{background:#fff;padding:32px 24px;border-radius:12px;
        box-shadow:0 1px 3px rgba(0,0,0,.08),0 4px 24px rgba(0,0,0,.04);max-width:420px}
      h1{font-size:1.25rem;color:#7b2d8e;margin-bottom:8px}
      p{font-size:.9rem;color:#64748b;line-height:1.5;margin-bottom:20px}
      button{background:#7b2d8e;color:#fff;border:0;padding:10px 20px;
        border-radius:8px;font-weight:600;cursor:pointer;font-size:.9rem}
      button:hover{background:#5e1f6e}
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>PayNow QR Generator works offline once it's loaded. If this is your first visit, please reconnect and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
