<!DOCTYPE html>
<html lang="en-SG" dir="ltr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>PayNow QR Generator — Free Singapore PayNow QR Code Maker</title>
    <meta name="description" content="Free Singapore PayNow QR code generator. Create EMVCO-compliant PayNow QR codes from your UEN with custom amount, expiry, reference number, and company name. 100% client-side, offline-capable, no signup. Open source.">
    <meta name="keywords" content="PayNow, QR code, Singapore, UEN, EMVCO, payment, generator, free, offline, PWA">
    <meta name="author" content="Yap Wei Jun">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#7b2d8e">
    <meta name="color-scheme" content="light">

    <link rel="canonical" href="https://yapweijun1996.github.io/PayNow-QR-Generator/">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="PayNow QR Generator — Free Singapore PayNow QR Code Maker">
    <meta property="og:description" content="Generate Singapore PayNow QR codes instantly. Free, offline-capable, no signup required.">
    <meta property="og:url" content="https://yapweijun1996.github.io/PayNow-QR-Generator/">
    <meta property="og:image" content="https://yapweijun1996.github.io/PayNow-QR-Generator/img/og-image.png">
    <meta property="og:image:alt" content="PayNow QR Generator app screenshot">
    <meta property="og:locale" content="en_SG">
    <meta property="og:site_name" content="PayNow QR Generator">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="PayNow QR Generator">
    <meta name="twitter:description" content="Free Singapore PayNow QR code generator. Client-side, offline-capable, no signup.">
    <meta name="twitter:image" content="https://yapweijun1996.github.io/PayNow-QR-Generator/img/og-image.png">

    <!-- PWA -->
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./img/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./img/favicon.svg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PayNow QR">

    <link rel="stylesheet" href="styles.css">

    <!-- Structured data: SoftwareApplication for Google rich result -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "PayNow QR Generator",
      "url": "https://yapweijun1996.github.io/PayNow-QR-Generator/",
      "description": "Free Singapore PayNow QR code generator. Create EMVCO-compliant PayNow QR codes from your UEN. 100% client-side, offline-capable, no signup.",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires JavaScript. Requires HTML5.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "SGD"
      },
      "author": {
        "@type": "Person",
        "name": "Yap Wei Jun",
        "url": "https://github.com/yapweijun1996"
      },
      "inLanguage": "en-SG",
      "isAccessibleForFree": true,
      "softwareVersion": "1.1.0"
    }
    </script>
  </head>
  <body>
    <!-- Update banner: shown when a new SW is installed and waiting -->
    <div class="update-banner" id="update-banner" role="status" aria-live="polite" hidden>
      <span>A new version is available.</span>
      <button type="button" id="update-reload">Reload</button>
    </div>

    <main class="container">
      <header class="header">
        <h1>PayNow QR Generator</h1>
        <p>Generate PayNow QR codes for Singapore payments</p>
      </header>

      <form id="qr-form" novalidate>
        <div class="form-group">
          <label for="uen">UEN<span class="required">*</span></label>
          <input type="text" id="uen" placeholder="e.g. 201812345A" required aria-required="true" autocomplete="off">
          <div class="input-hint">Unique Entity Number for your business</div>
        </div>

        <div class="form-group">
          <label for="amount">Amount <span class="optional">(optional)</span></label>
          <div class="input-with-prefix">
            <span class="prefix">S$</span>
            <input type="number" id="amount" placeholder="0.00" min="0" step="0.01" inputmode="decimal">
          </div>
        </div>

        <div class="form-group">
          <label for="expiry">Expiry Date <span class="optional">(optional)</span></label>
          <input type="date" id="expiry">
        </div>

        <div class="form-group">
          <label for="refNumber">Reference Number <span class="optional">(optional)</span></label>
          <input type="text" id="refNumber" placeholder="e.g. INV-2024-001" autocomplete="off">
        </div>

        <div class="form-group">
          <label for="company">Company Name <span class="optional">(optional)</span></label>
          <input type="text" id="company" placeholder="e.g. Acme Pte Ltd" autocomplete="off">
        </div>

        <button type="submit" class="btn btn-primary" id="generate-qr">
          Generate QR Code
        </button>
        <button type="button" class="btn-text btn-sample" id="load-sample">
          Try with sample data
        </button>
      </form>

      <div class="message message-success" id="success-message" role="status" aria-live="polite">
        QR Code generated successfully!
      </div>
      <div class="message message-error" id="error-message" role="alert" aria-live="assertive"></div>

      <section class="qr-output" id="qr-output" aria-label="Generated QR code">
        <div class="qr-wrapper">
          <canvas id="qr-canvas"></canvas>
        </div>
        <div class="download-section">
          <select id="qr-size" aria-label="QR code download size">
            <option value="256">256 x 256 px</option>
            <option value="512" selected>512 x 512 px</option>
            <option value="1024">1024 x 1024 px</option>
          </select>
          <button type="button" class="btn btn-success" id="download-qr">
            <svg class="icon-download" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Download PNG
          </button>
        </div>
      </section>

      <section class="history-section" id="history-section" style="display:none;" aria-label="Saved history">
        <div class="history-header">
          <h2>History</h2>
          <button type="button" class="btn-text" id="clear-history">Clear All</button>
        </div>
        <div id="history-list"></div>
      </section>

      <footer class="footer">
        <p>Built for Singapore PayNow &middot; <a href="https://github.com/yapweijun1996/PayNow-QR-Generator" target="_blank" rel="noopener">GitHub</a></p>
      </footer>
    </main>

    <script src="./js/paynowqr.min.js"></script>
    <script src="./js/qrious.min.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
